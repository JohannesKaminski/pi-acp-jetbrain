name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # engines >=22.19 (pi 1.0 minimum); 24 is the current CI baseline (F-031).
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node scripts/check.mjs
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:pack
      # The full `npm run smoke` matrix stays local: it spawns the `pi` binary and
      # makes real model calls, which GitHub runners do not provision. Run
      # `npm run smoke:full` locally before a release.
